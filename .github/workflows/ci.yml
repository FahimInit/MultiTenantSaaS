name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore MultiTenantSaaS.sln

      - name: Build solution
        run: dotnet build MultiTenantSaaS.sln --configuration Release --no-restore

      - name: Run Domain Unit Tests
        run: dotnet test tests/SaaS.Domain.UnitTests/SaaS.Domain.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run Application Unit Tests
        run: dotnet test tests/SaaS.Application.UnitTests/SaaS.Application.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run API & PostgreSQL Integration Tests
        run: dotnet test tests/SaaS.API.IntegrationTests/SaaS.API.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build
